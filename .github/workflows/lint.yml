name: Lint

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@28a7e8bdb81fd8ad675883de92c758ab78e0ce10 # v24
        with:
          globs: '**/*.md'
      - name: Install host linters
        run: sudo apt-get update && sudo apt-get install --yes fish shellcheck
      - name: Lint GitHub Actions workflows
        run: >-
          docker run --rm -v "$PWD:/work" -w /work
          rhysd/actionlint:1.7.10
      - name: Lint shell and Fish files when present
        run: |
          files=$(mktemp)
          trap 'rm -f "$files"' EXIT
          for directory in scripts images; do
            test -d "$directory" || continue
            find "$directory" -type f \( -name '*.sh' -o -path 'scripts/*' \) -not -path 'scripts/session/fixtures/*' -print0 >> "$files"
          done
          mapfile -d '' bash_files < "$files"
          if ((${#bash_files[@]})); then shellcheck "${bash_files[@]}"; fi
          : > "$files"
          if test -d shell/fish; then find shell/fish -type f -name '*.fish' -print0 > "$files"; fi
          mapfile -d '' fish_files < "$files"
          if ((${#fish_files[@]})); then fish --no-execute "${fish_files[@]}"; fi
      - name: Lint Dockerfiles when present
        run: ./scripts/lint-dockerfiles

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
