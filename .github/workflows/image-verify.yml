name: ARM64 image verification

on:
  pull_request:
    paths: [images/**, scripts/**, shell/**, config/**, docker-bake.hcl, versions.env, .dockerignore]
  push:
    branches: [main]
    paths: [images/**, scripts/**, shell/**, config/**, docker-bake.hcl, versions.env, .dockerignore]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build ARM64 images into Docker
        run: ./scripts/build
      - name: Run image verification
        run: ./scripts/verify

  publish-release-marker:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.before != '0000000000000000000000000000000000000000'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect agent runtime version changes
        id: versions
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          git show "$BEFORE:versions.env" > previous-versions.env
          set +e
          ./scripts/release-marker changed previous-versions.env versions.env
          status=$?
          set -e
          case "$status" in
            0) echo 'changed=true' >> "$GITHUB_OUTPUT" ;;
            1) echo 'changed=false' >> "$GITHUB_OUTPUT" ;;
            *) exit "$status" ;;
          esac
      - name: Publish immutable release marker
        if: steps.versions.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          set -a
          source versions.env
          set +a
          tag="agent-versions-codex-${CODEX_VERSION}-claude-${CLAUDE_CODE_VERSION}"
          timestamp=$(date --utc +%Y-%m-%dT%H:%M:%SZ)
          ./scripts/release-marker create release.json "$COMMIT" "$CODEX_VERSION" "$CLAUDE_CODE_VERSION" "$timestamp"

          if gh release view "$tag" --repo "$REPOSITORY" >/dev/null 2>&1; then
            release_commit=$(gh release view "$tag" --repo "$REPOSITORY" --json targetCommitish --jq .targetCommitish)
            test "$release_commit" = "$COMMIT" || {
              printf '%s\n' "error: existing release points to $release_commit, expected $COMMIT" >&2
              exit 1
            }
            mkdir existing-marker
            gh release download "$tag" --repo "$REPOSITORY" --pattern release.json --dir existing-marker
            ./scripts/release-marker validate existing-marker/release.json "$COMMIT" "$CODEX_VERSION" "$CLAUDE_CODE_VERSION"
            exit 0
          fi

          if gh api "repos/$REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            printf '%s\n' "error: tag already exists without a release: $tag" >&2
            exit 1
          fi

          gh release create "$tag" --repo "$REPOSITORY" --target "$COMMIT" \
            --title "Agent versions: Codex ${CODEX_VERSION}, Claude Code ${CLAUDE_CODE_VERSION}" \
            --notes "Machine-readable agent runtime release marker for ${COMMIT}." \
            release.json
