name: ARM64 image verification

on:
  pull_request:
    paths: [images/**, scripts/**, shell/**, config/**, docker-bake.hcl, versions.env, .dockerignore]
  push:
    branches: [main]
    paths: [images/**, scripts/**, shell/**, config/**, docker-bake.hcl, versions.env, .dockerignore]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build ARM64 images into Docker
        run: ./scripts/build
      - name: Run image verification
        run: ./scripts/verify

  publish-release-marker:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.before != '0000000000000000000000000000000000000000'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect agent runtime version changes
        id: versions
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          git show "$BEFORE:versions.env" > previous-versions.env
          if ./.github/workflows/release-marker changed previous-versions.env versions.env; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          else
            status=$?
            test "$status" = 1 || exit "$status"
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Publish immutable release marker
        if: steps.versions.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: ./.github/workflows/publish-release-marker "$COMMIT"
