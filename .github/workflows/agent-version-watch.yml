name: Agent version watch

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: agent-version-watch
  cancel-in-progress: false

jobs:
  update-versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Update agent runtime versions
        run: ./.github/workflows/update-agent-versions
      - name: Create or update pull request
        id: cpr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          add-paths: versions.env
          base: main
          branch: automated/agent-version-update
          delete-branch: true
          commit-message: 'chore: update agent runtime versions'
          title: 'chore: update agent runtime versions'
          body: |
            Updates Codex to ${{ env.CODEX_VERSION }} and Claude Code to ${{ env.CLAUDE_CODE_VERSION }}.
            Merging this pull request runs ARM64 verification and publishes the immutable release marker.
