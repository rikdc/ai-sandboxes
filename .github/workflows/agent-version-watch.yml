name: Agent version watch

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: agent-version-watch
  cancel-in-progress: false

jobs:
  update-versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Discover latest stable agent versions
        id: versions
        run: |
          codex_version=$(curl --fail --location --silent --show-error --retry 3 https://registry.npmjs.org/@openai%2Fcodex/latest | jq --raw-output --exit-status .version)
          claude_version=$(curl --fail --location --silent --show-error --retry 3 https://registry.npmjs.org/@anthropic-ai%2Fclaude-code/latest | jq --raw-output --exit-status .version)
          version_pattern='^[A-Za-z0-9][A-Za-z0-9._-]*$'
          for version in "$codex_version" "$claude_version"; do
            [[ "$version" =~ $version_pattern && "$version" != *..* ]] || {
              printf '%s\n' "error: invalid discovered version: $version" >&2
              exit 1
            }
          done
          printf 'codex=%s\n' "$codex_version" >> "$GITHUB_OUTPUT"
          printf 'claude=%s\n' "$claude_version" >> "$GITHUB_OUTPUT"
      - name: Update version pins and create pull request
        env:
          GH_TOKEN: ${{ github.token }}
          CODEX_VERSION: ${{ steps.versions.outputs.codex }}
          CLAUDE_CODE_VERSION: ${{ steps.versions.outputs.claude }}
          REPOSITORY: ${{ github.repository }}
        run: |
          branch=automated/agent-version-update
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            git fetch origin "$branch"
            git switch -C "$branch" "origin/$branch"
          else
            git switch -c "$branch"
          fi
          sed -i "s/^CODEX_VERSION=.*/CODEX_VERSION=$CODEX_VERSION/" versions.env
          sed -i "s/^CLAUDE_CODE_VERSION=.*/CLAUDE_CODE_VERSION=$CLAUDE_CODE_VERSION/" versions.env
          git diff --quiet -- versions.env && exit 0

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add versions.env
          git commit -m 'chore: update agent runtime versions'
          git push --set-upstream origin "$branch"

          if ! gh pr list --repo "$REPOSITORY" --base main --head "$branch" --state open --json number --jq '.[0].number' | grep -q .; then
            gh pr create --repo "$REPOSITORY" --base main --head "$branch" \
              --title "chore: update agent runtime versions" \
              --body "Updates Codex to $CODEX_VERSION and Claude Code to $CLAUDE_CODE_VERSION. Merging this pull request runs ARM64 verification and publishes the immutable release marker."
          fi
