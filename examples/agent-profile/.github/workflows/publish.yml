name: Publish profile images

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GHCR_NAMESPACE: ${{ github.repository_owner }}
      IMAGE_TAG: sha-${{ github.sha }}
    steps:
      - name: Check out profile
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up QEMU for ARM64
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v3.6.0
        with:
          platforms: arm64
      - name: Set up Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Log in to GHCR
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build, verify, and publish
        run: ./scripts/publish-profile "$IMAGE_TAG"
      - name: Job summary
        run: |
          {
            echo "## Private profile images"
            echo
            echo "- ghcr.io/${GHCR_NAMESPACE}/agent-profile-claude:${IMAGE_TAG}"
            echo "- ghcr.io/${GHCR_NAMESPACE}/agent-profile-codex:${IMAGE_TAG}"
            echo
            echo "Consumers should resolve immutable tags to image digests before deployment."
          } >> "$GITHUB_STEP_SUMMARY"
